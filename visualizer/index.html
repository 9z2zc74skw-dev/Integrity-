<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Integrity Upfitters — Lighting Visualizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#0c0c0e;
  --surface:#161618;
  --s2:#1e1e22;
  --s3:#27272b;
  --border:#2e2e33;
  --border-hi:#3f3f46;
  --text:#f4f4f5;
  --muted:#a1a1aa;
  --faint:#71717a;
  --primary:#3b82f6;
  --primary-hi:#60a5fa;
  --pd:rgba(59,130,246,.14);
  --red:#ef4444;
  --radius:8px;
  --font:Inter,system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{font-family:var(--font);background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{height:54px;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.brand{display:flex;align-items:center;gap:10px;flex-shrink:0}
.brand-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center;font-size:14px;box-shadow:0 2px 10px rgba(59,130,246,.35)}
.brand-text{line-height:1.2}
.brand-text strong{font-size:13.5px;font-weight:600;display:block;letter-spacing:-.01em}
.brand-text span{font-size:11px;color:var(--muted)}
.header-mid{display:flex;align-items:center;gap:8px;flex:1;justify-content:center}
.header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
select,input[type=text]{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:0 10px;height:32px;font-size:12.5px;font-family:inherit;outline:none;transition:border-color .12s}
select:focus,input[type=text]:focus{border-color:var(--primary)}
.btn{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:0 12px;height:32px;font-size:12.5px;font-weight:500;font-family:inherit;cursor:pointer;display:inline-flex;align-items:center;gap:5px;transition:background .12s,border-color .12s}
.btn:hover{background:var(--s3);border-color:var(--border-hi)}
.btn-primary{background:var(--primary);border-color:#2563eb;color:#fff;font-weight:600;box-shadow:0 1px 8px rgba(59,130,246,.28)}
.btn-primary:hover{background:#2563eb}
.layout{flex:1;display:grid;grid-template-columns:252px 1fr 232px;min-height:0}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.panel-r{border-right:none;border-left:1px solid var(--border)}
.panel-head{padding:11px 14px;display:flex;justify-content:space-between;align-items:center;font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;border-bottom:1px solid var(--border);flex-shrink:0}
.badge{background:var(--s3);color:var(--muted);font-size:10.5px;padding:2px 7px;border-radius:99px;font-weight:500;text-transform:none;letter-spacing:0}
.search-wrap{padding:8px 10px;border-bottom:1px solid var(--border);flex-shrink:0}
.search-wrap input{width:100%;height:30px;font-size:12px}
.parts-list{flex:1;overflow-y:auto;padding:6px 6px 16px}
.parts-list::-webkit-scrollbar{width:5px}
.parts-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.group{margin-bottom:6px}
.group-title{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;padding:8px 8px 4px}
.part{display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:7px;cursor:grab;user-select:none;border:1px solid transparent;transition:background .12s,border-color .12s}
.part:hover{background:var(--s2);border-color:var(--border)}
.part:active{cursor:grabbing}
.part.placing{outline:1px solid rgba(59,130,246,.55);background:var(--pd);border-color:rgba(59,130,246,.35)}
.part-dot{width:16px;height:9px;border-radius:2px;background:linear-gradient(90deg,#ef4444 42%,#3b82f6 58%);flex-shrink:0;box-shadow:0 0 6px rgba(59,130,246,.25)}
.part-info{min-width:0}
.part-sku{font-size:12px;font-weight:600;line-height:1.2}
.part-name{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
.stage-wrap{display:flex;flex-direction:column;min-height:0;background:#08080a}
.view-tabs{display:flex;gap:3px;padding:8px 10px;background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.view-tab{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:7px;padding:5px 11px;font-size:12px;font-weight:500;font-family:inherit;cursor:pointer;white-space:nowrap;transition:all .12s}
.view-tab:hover{color:var(--text);background:var(--s2)}
.view-tab.active{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;box-shadow:0 1px 8px rgba(59,130,246,.3)}
.view-tab .n{display:inline-block;min-width:15px;height:15px;line-height:15px;text-align:center;font-size:10px;background:rgba(255,255,255,.16);border-radius:8px;margin-left:4px;padding:0 4px;font-weight:600}
.hint-bar{font-size:11px;color:var(--faint);padding:7px 12px 0;text-align:center;flex-shrink:0}
.stage-area{flex:1;display:flex;align-items:center;justify-content:center;padding:10px 16px;min-height:0;position:relative}
.stage{position:relative;max-width:100%;max-height:100%;background:radial-gradient(ellipse at center,#1a1a1e 0%,#08080a 72%);border-radius:14px;overflow:hidden;border:1px solid var(--border);box-shadow:0 10px 48px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.03)}
.stage img.vehicle{display:block;max-width:100%;max-height:calc(100vh - 168px);width:auto;height:auto;user-select:none;pointer-events:none;filter:drop-shadow(0 14px 32px rgba(0,0,0,.5))}
.stage.drag-over{outline:2px dashed var(--primary);outline-offset:-5px}
.drop-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(59,130,246,.07);color:var(--primary-hi);font-weight:600;font-size:13px;pointer-events:none;z-index:5;border:2px dashed transparent;border-radius:12px}
.stage.drag-over .drop-hint{display:flex}
.light{position:absolute;cursor:move;transform-origin:center center;z-index:10;touch-action:none;user-select:none}
.light img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 1px 3px rgba(0,0,0,.55)) drop-shadow(0 0 4px rgba(59,130,246,.18))}
.light.selected{outline:2px solid var(--primary);outline-offset:4px;border-radius:3px}
.light .tag{position:absolute;left:50%;top:calc(100% + 5px);transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .12s;border:1px solid rgba(255,255,255,.1)}
.light.selected .tag,.light:hover .tag{opacity:1}
.light .ctrls{position:absolute;top:-32px;left:50%;transform:translateX(-50%);display:none;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:7px;padding:2px;z-index:20;box-shadow:0 6px 18px rgba(0,0,0,.45)}
.light.selected .ctrls{display:flex}
.light .ctrls button{width:26px;height:26px;border:none;background:transparent;color:var(--muted);border-radius:5px;cursor:pointer;font-size:13px;display:grid;place-items:center;transition:background .12s,color .12s}
.light .ctrls button:hover{background:var(--s3);color:var(--text)}
.light .ctrls button.x:hover{background:var(--red);color:#fff}
.stage-bar{display:flex;justify-content:center;gap:8px;padding:8px 10px 12px;flex-shrink:0}
.section{border-bottom:1px solid var(--border)}
.section:last-child{border-bottom:none}
.toggles{padding:10px;display:flex;flex-direction:column;gap:6px}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:9px 11px;background:var(--s2);border-radius:8px;border:1px solid var(--border)}
.toggle .lbl{font-size:12.5px;font-weight:500}
.toggle .lbl small{display:block;color:var(--faint);font-size:10.5px;font-weight:400;margin-top:1px}
.sw{width:36px;height:20px;background:#3f3f46;border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.sw.on{background:var(--primary)}
.sw::after{content:"";position:absolute;width:14px;height:14px;background:#fff;border-radius:50%;top:3px;left:3px;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.sw.on::after{transform:translateX(16px)}
.schemes{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:5px}
.scheme{padding:8px 6px;border-radius:7px;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:11.5px;font-weight:500;cursor:pointer;font-family:inherit;text-align:center;transition:all .12s}
.scheme:hover{border-color:var(--border-hi);color:var(--text)}
.scheme.active{border-color:var(--primary);background:var(--pd);color:var(--text)}
.summary{padding:10px 14px 14px}
.sum-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px;color:var(--muted)}
.sum-row b{color:var(--text);font-weight:600}
.sum-total{margin-top:6px;padding-top:8px;border-top:1px solid var(--border);font-weight:500;color:var(--text)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  .panel{max-height:150px;border-right:none;border-bottom:1px solid var(--border)}
  .panel-r{border-left:none;border-top:1px solid var(--border);max-height:160px}
  .header-mid{display:none}
}
@media print{
  header,.panel,.view-tabs,.stage-bar,.hint-bar{display:none!important}
  .layout{display:block}
  .stage-wrap,.stage-area,.stage{background:#fff;border:none;box-shadow:none}
  .stage img.vehicle{max-height:none;width:100%;filter:none}
}
</style>
</head>
<body>
<!--
  Durango-first lighting visualizer (source of truth: this file, not compiled-app/).
  Local run:
    - Open visualizer/index.html in a browser, OR
    - From repo root: npx --yes serve visualizer
-->
<header>
  <div class="brand">
    <div class="brand-icon">&#9889;</div>
    <div class="brand-text">
      <strong>Lighting Visualizer</strong>
      <span>Integrity Upfitters · Durango</span>
    </div>
  </div>
  <div class="header-mid">
    <select id="vehicleSelect" aria-label="Vehicle">
      <option value="durango" selected>Dodge Durango Pursuit</option>
    </select>
    <input type="text" id="quoteInput" placeholder="Quote #" style="width:96px"/>
    <button class="btn" id="loadBtn" type="button">Load SKUs</button>
  </div>
  <div class="header-right">
    <button class="btn btn-primary" id="pdfBtn" type="button">PDF Sign-off</button>
  </div>
</header>
<div class="layout">
  <aside class="panel">
    <div class="panel-head"><span>Parts</span><span class="badge" id="skuBadge">0</span></div>
    <div class="search-wrap"><input type="text" id="search" placeholder="Search SKU or name…"/></div>
    <div class="parts-list" id="partsList"></div>
  </aside>
  <section class="stage-wrap">
    <div class="view-tabs" id="viewTabs"></div>
    <div class="hint-bar" id="hintBar">Drag a part onto the vehicle, or click a part to place at its default mount.</div>
    <div class="stage-area" id="stageArea">
      <div class="stage" id="stage">
        <img class="vehicle" id="vehicleImg" src="durango_front.png" alt="Vehicle" draggable="false"/>
        <div class="drop-hint">Drop light here</div>
      </div>
    </div>
    <div class="stage-bar">
      <button class="btn" id="clearView" type="button">Clear View</button>
      <button class="btn" id="clearAll" type="button">Clear All</button>
    </div>
  </section>
  <aside class="panel panel-r">
    <div class="section">
      <div class="panel-head">Build Parameters</div>
      <div class="toggles">
        <div class="toggle"><div class="lbl">Push Bar<small>Front bumper guard</small></div><button type="button" class="sw" data-on="false" aria-label="Push Bar"></button></div>
        <div class="toggle"><div class="lbl">Interior Dash<small>Windshield warning</small></div><button type="button" class="sw" data-on="false" aria-label="Interior Dash"></button></div>
        <div class="toggle"><div class="lbl">Rear Hatch Lights<small>Liftgate glass stick</small></div><button type="button" class="sw" data-on="false" aria-label="Rear Hatch Lights"></button></div>
      </div>
    </div>
    <div class="section">
      <div class="panel-head">Body Color</div>
      <div class="schemes" id="bodyColor">
        <button class="scheme active" data-body="white" type="button">White</button>
        <button class="scheme" data-body="black" type="button">Black</button>
      </div>
    </div>
    <div class="section">
      <div class="panel-head">Color Scheme</div>
      <div class="schemes" id="colorScheme">
        <button class="scheme active" data-s="rb" type="button">Red / Blue</button>
        <button class="scheme" data-s="bw" type="button">Blue / White</button>
        <button class="scheme" data-s="rw" type="button">Red / White</button>
        <button class="scheme" data-s="rbw" type="button">R / B / W</button>
      </div>
    </div>
    <div class="section">
      <div class="panel-head">Placement</div>
      <div class="summary" id="summary"></div>
    </div>
  </aside>
</div>
<script>
(function(){
/* Durango-only visualizer. Catalog w ≈ % of vehicle width for FedSig sprites.
   Defaults aligned to compiled-app Durango mounts (+ fixtureNudge dy≈1). */
var VIEWS=[
  {id:"front",label:"Front",imgW:"durango_front.png",imgB:"durango_front_black.png"},
  {id:"rear",label:"Rear",imgW:"durango_rear.png",imgB:"durango_rear_black.png"},
  {id:"rear_open",label:"Hatch Open",imgW:"durango_rear_open.png",imgB:"durango_rear_open_black.png"},
  {id:"left",label:"Left",imgW:"durango_left.png",imgB:"durango_left_black.png"},
  {id:"right",label:"Right",imgW:"durango_right.png",imgB:"durango_right_black.png"},
  {id:"hero",label:"3/4 View",imgW:"durango_hero.png",imgB:"durango_hero_black.png"}
];
var CATALOG=[
  {sku:"ALGT",name:"Allegiant Roof Lightbar (53\")",group:"Front / Perimeter",fx:"fx_algt_rb.png",w:48},
  {sku:"SIFMJS",name:"SpectraLux ILS Visor (Front)",group:"Front / Perimeter",fx:"fx_ils_rb.png",w:28},
  {sku:"DYNA-1",name:"DynaFlare 1 ft",group:"Front / Perimeter",fx:"fx_dyna_1ft_rb.png",w:10},
  {sku:"DYNA-2",name:"DynaFlare 2 ft",group:"Front / Perimeter",fx:"fx_dyna_2ft_rb.png",w:18},
  {sku:"DYNA-5",name:"DynaFlare 5 ft",group:"Front / Perimeter",fx:"fx_dyna_5ft_rb.png",w:42},
  {sku:"DYNA-6",name:"DynaFlare 6 ft",group:"Front / Perimeter",fx:"fx_dyna_6ft_rb.png",w:50},
  {sku:"MPS63",name:"MicroPulse 6-3 Grille",group:"Front / Perimeter",fx:"fx_mps63_rb.png",w:4.5},
  {sku:"MPSW9",name:"MicroPulse Wide 9 Mirror",group:"Front / Perimeter",fx:"fx_mps123_rb.png",w:6},
  {sku:"MPS123",name:"MicroPulse 12-3",group:"Rear Hatch",fx:"fx_mps123_rb.png",w:7},
  {sku:"SIFMJH",name:"SpectraLux ILS (Rear Hatch)",group:"Rear Hatch",fx:"fx_ils_rb.png",w:26},
  {sku:"STICK-RB",name:"Warning Stick R/B",group:"Rear Hatch",fx:"fx_stick_rb.png",w:22},
  {sku:"XSM2",name:"SpectraLux XSM2 Module",group:"Rear Hatch",fx:"fx_mps_small_rb.png",w:4},
  {sku:"416300",name:"Perimeter Lighthead",group:"Rear Hatch",fx:"fx_round_rb.png",w:3},
  {sku:"PF200",name:"PathFinder PF200 Siren Amp",group:"Siren / Control",fx:null,w:6},
  {sku:"ES100C",name:"ES100C Speaker",group:"Siren / Control",fx:null,w:5},
  {sku:"ESBL",name:"ES100 Speaker Bracket",group:"Siren / Control",fx:null,w:5},
  {sku:"OBDFORD",name:"OBD Interface (Ford)",group:"Siren / Control",fx:null,w:5},
  {sku:"EXPMOD24",name:"Expansion Module 24",group:"Siren / Control",fx:null,w:5}
];
/* Per-view defaults from compiled-app (percent → fraction) + Durango nudge dy+0.01 */
var DEFAULTS={
  ALGT:{front:[0.5,0.23,0],rear:[0.5,0.23,0],left:[0.48,0.23,0],right:[0.48,0.23,0],hero:[0.46,0.21,0],_:[0.5,0.2,0]},
  SIFMJS:{front:[0.5,0.31,0],hero:[0.45,0.28,-15],_:[0.5,0.28,0]},
  MPS63:{front:[0.4,0.52,0],hero:[0.33,0.53,-20],_:[0.38,0.5,0]},
  MPSW9:{front:[0.24,0.41,0],left:[0.3,0.42,0],right:[0.3,0.42,0],hero:[0.44,0.37,0],_:[0.22,0.4,0]},
  "DYNA-1":{front:[0.5,0.63,0],hero:[0.34,0.61,-6],rear:[0.5,0.31,180],_:[0.5,0.62,0]},
  "DYNA-2":{front:[0.5,0.63,0],hero:[0.36,0.61,-6],rear:[0.5,0.31,180],_:[0.5,0.62,0]},
  "DYNA-5":{front:[0.5,0.67,0],hero:[0.44,0.63,-6],rear:[0.5,0.31,180],_:[0.5,0.66,0]},
  "DYNA-6":{front:[0.5,0.67,0],hero:[0.46,0.63,-6],rear:[0.5,0.31,180],_:[0.5,0.66,0]},
  SIFMJH:{rear:[0.5,0.28,0],hero:[0.76,0.29,160],rear_open:[0.5,0.45,0],_:[0.5,0.4,0]},
  "STICK-RB":{rear:[0.5,0.35,0],rear_open:[0.5,0.5,0],_:[0.5,0.4,0]},
  MPS123:{rear:[0.26,0.41,180],rear_open:[0.3,0.5,90],_:[0.5,0.45,90]},
  XSM2:{rear:[0.3,0.43,200],rear_open:[0.35,0.48,0],_:[0.55,0.5,0]},
  "416300":{rear:[0.62,0.37,180],rear_open:[0.4,0.17,180],_:[0.7,0.45,0]}
};
var view="front",bodyColor="white",scheme="rb",nodes={},sel=null,nid=1;
var dragSku=null,dragClearTimer=null,emptyDragImg=null;

VIEWS.forEach(function(v){nodes[v.id]=[]});

function getEmptyDragImage(){
  if(emptyDragImg) return emptyDragImg;
  emptyDragImg=document.createElement("canvas");
  emptyDragImg.width=1; emptyDragImg.height=1;
  return emptyDragImg;
}
function setDragSku(sku){
  if(dragClearTimer){clearTimeout(dragClearTimer); dragClearTimer=null}
  dragSku=sku||null;
}
function clearDragSkuSoon(){
  if(dragClearTimer) clearTimeout(dragClearTimer);
  dragClearTimer=setTimeout(function(){dragSku=null; dragClearTimer=null},220);
}
function resolveDragSku(e){
  var fromDt="";
  try{fromDt=e.dataTransfer&&e.dataTransfer.getData("text/plain")||""}catch(err){}
  return fromDt||dragSku||null;
}
function defaultFor(sku){
  var map=DEFAULTS[sku];
  if(!map) return {x:0.5,y:0.4,rot:0};
  var d=map[view]||map._||[0.5,0.4,0];
  return {x:d[0],y:d[1],rot:d[2]||0};
}
function fxFor(part){
  if(!part.fx) return null;
  var f=part.fx;
  if(scheme==="bw") f=f.replace("_rb.","_bw.").replace("_r.","_bw.").replace("_b.","_bw.");
  else if(scheme==="rw") f=f.replace("_rb.","_r.").replace("_bw.","_r.").replace("_b.","_r.");
  return "fx/"+f;
}
function renderParts(){
  var q=(document.getElementById("search").value||"").toLowerCase();
  var groups={},count=0;
  CATALOG.forEach(function(p){
    if(q&&p.sku.toLowerCase().indexOf(q)<0&&p.name.toLowerCase().indexOf(q)<0) return;
    (groups[p.group]=groups[p.group]||[]).push(p);
  });
  var el=document.getElementById("partsList"); el.innerHTML="";
  Object.keys(groups).forEach(function(g){
    var wrap=document.createElement("div"); wrap.className="group";
    var t=document.createElement("div"); t.className="group-title"; t.textContent=g; wrap.appendChild(t);
    groups[g].forEach(function(p){
      count++;
      var row=document.createElement("div");
      row.className="part"; row.draggable=true; row.dataset.sku=p.sku;
      row.innerHTML='<div class="part-dot"></div><div class="part-info"><div class="part-sku">'+p.sku+'</div><div class="part-name">'+p.name+"</div></div>";
      row.addEventListener("dragstart",function(e){
        setDragSku(p.sku);
        try{
          e.dataTransfer.setData("text/plain",p.sku);
          e.dataTransfer.setData("application/x-iu-sku",p.sku);
          e.dataTransfer.effectAllowed="copy";
          e.dataTransfer.setDragImage(getEmptyDragImage(),0,0);
        }catch(err){}
        row.classList.add("placing");
        document.getElementById("hintBar").textContent="Drop on the vehicle to place "+p.sku+".";
      });
      row.addEventListener("dragend",function(){
        row.classList.remove("placing");
        clearDragSkuSoon();
        document.getElementById("hintBar").textContent="Drag a part onto the vehicle, or click a part to place at its default mount.";
      });
      row.addEventListener("click",function(){
        var d=defaultFor(p.sku);
        addNode(p.sku,d.x,d.y,d.rot);
      });
      wrap.appendChild(row);
    });
    el.appendChild(wrap);
  });
  document.getElementById("skuBadge").textContent=String(count);
}
function renderTabs(){
  var el=document.getElementById("viewTabs"); el.innerHTML="";
  VIEWS.forEach(function(v){
    var b=document.createElement("button");
    b.type="button";
    b.className="view-tab"+(v.id===view?" active":"");
    b.innerHTML=v.label+'<span class="n">'+nodes[v.id].length+"</span>";
    b.onclick=function(){view=v.id;sel=null;renderTabs();renderStage();renderSum()};
    el.appendChild(b);
  });
}
function renderStage(){
  var v=VIEWS.find(function(x){return x.id===view});
  document.getElementById("vehicleImg").src=bodyColor==="black"?v.imgB:v.imgW;
  var stage=document.getElementById("stage");
  stage.querySelectorAll(".light").forEach(function(n){n.remove()});
  nodes[view].forEach(function(p){
    var el=document.createElement("div");
    el.className="light"+(p.id===sel?" selected":"");
    el.dataset.id=String(p.id);
    el.style.left=(p.x*100)+"%";
    el.style.top=(p.y*100)+"%";
    el.style.width=(p.w*p.scale)+"%";
    el.style.transform="translate(-50%,-50%) rotate("+p.rot+"deg)";
    var part=CATALOG.find(function(c){return c.sku===p.sku});
    var src=part?fxFor(part):null;
    if(src){
      el.innerHTML='<img src="'+src+'" alt="'+p.sku+'" draggable="false"/><div class="tag">'+p.sku+'</div><div class="ctrls"><button type="button" data-act="rot" title="Rotate">&#8635;</button><button type="button" data-act="in" title="Larger">+</button><button type="button" data-act="out" title="Smaller">&#8722;</button><button type="button" data-act="del" class="x" title="Remove">&#215;</button></div>';
    } else {
      el.innerHTML='<div style="background:linear-gradient(135deg,#2a2a30,#1a1a1e);color:#c4c4cc;font-size:10px;padding:5px 9px;border-radius:5px;border:1px solid #3f3f46;white-space:nowrap">'+p.sku+'</div><div class="tag">'+p.sku+'</div><div class="ctrls"><button type="button" data-act="del" class="x" title="Remove">&#215;</button></div>';
    }
    el.addEventListener("mousedown",function(e){
      if(e.target.closest(".ctrls")) return;
      e.preventDefault(); e.stopPropagation();
      sel=p.id; renderStage();
      var node=nodes[view].find(function(n){return n.id===p.id});
      if(node) startMove(e,node,false);
    });
    el.addEventListener("touchstart",function(e){
      if(e.target.closest(".ctrls")) return;
      e.stopPropagation();
      sel=p.id; renderStage();
      var node=nodes[view].find(function(n){return n.id===p.id});
      if(node) startMove(e,node,true);
    },{passive:false});
    el.querySelectorAll(".ctrls button").forEach(function(btn){
      btn.onclick=function(e){
        e.stopPropagation();
        var a=btn.dataset.act;
        if(a==="del"){nodes[view]=nodes[view].filter(function(n){return n.id!==p.id}); sel=null}
        else if(a==="rot") p.rot=(p.rot+15)%360;
        else if(a==="in") p.scale=Math.min(2.5,+(p.scale+0.1).toFixed(2));
        else if(a==="out") p.scale=Math.max(0.3,+(p.scale-0.1).toFixed(2));
        renderStage(); renderTabs(); renderSum();
      };
    });
    stage.appendChild(el);
  });
}
function startMove(e,p,isTouch){
  var stage=document.getElementById("stage");
  var rect=stage.getBoundingClientRect();
  function point(ev){
    var t=isTouch?(ev.touches[0]||ev.changedTouches[0]):ev;
    return {x:(t.clientX-rect.left)/rect.width,y:(t.clientY-rect.top)/rect.height};
  }
  function onMove(ev){
    if(isTouch) ev.preventDefault();
    var c=point(ev);
    p.x=Math.max(0.02,Math.min(0.98,c.x));
    p.y=Math.max(0.02,Math.min(0.98,c.y));
    var n=document.querySelector('.light[data-id="'+p.id+'"]');
    if(n){n.style.left=(p.x*100)+"%"; n.style.top=(p.y*100)+"%"}
  }
  function onUp(){
    document.removeEventListener(isTouch?"touchmove":"mousemove",onMove);
    document.removeEventListener(isTouch?"touchend":"mouseup",onUp);
    renderSum();
  }
  document.addEventListener(isTouch?"touchmove":"mousemove",onMove,{passive:false});
  document.addEventListener(isTouch?"touchend":"mouseup",onUp);
}
function addNode(sku,x,y,rot){
  var part=CATALOG.find(function(p){return p.sku===sku});
  if(!part) return;
  var id=nid++;
  nodes[view].push({id:id,sku:part.sku,name:part.name,w:part.w||10,x:x,y:y,scale:1,rot:rot||0});
  sel=id;
  renderStage(); renderTabs(); renderSum();
}
function placeFromEvent(e,clamp){
  var sku=resolveDragSku(e);
  if(!sku) return false;
  var stage=document.getElementById("stage");
  var r=stage.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width;
  var y=(e.clientY-r.top)/r.height;
  if(clamp){
    x=Math.max(0.1,Math.min(0.9,x));
    y=Math.max(0.1,Math.min(0.9,y));
  } else {
    x=Math.max(0.02,Math.min(0.98,x));
    y=Math.max(0.02,Math.min(0.98,y));
  }
  var d=defaultFor(sku);
  addNode(sku,x,y,d.rot||0);
  setDragSku(null);
  return true;
}
function renderSum(){
  var total=0,html="";
  VIEWS.forEach(function(v){
    var n=nodes[v.id].length; total+=n;
    html+='<div class="sum-row"><span>'+v.label+"</span><b>"+n+"</b></div>";
  });
  html+='<div class="sum-row sum-total"><span>Total</span><b>'+total+"</b></div>";
  document.getElementById("summary").innerHTML=html;
}

var stage=document.getElementById("stage");
var stageArea=document.getElementById("stageArea");

function onDragOver(e){
  e.preventDefault();
  try{e.dataTransfer.dropEffect="copy"}catch(err){}
  stage.classList.add("drag-over");
}
function onDragLeave(e){
  if(!stage.contains(e.relatedTarget)&&e.relatedTarget!==stage) stage.classList.remove("drag-over");
}
function onDrop(e,clamp){
  e.preventDefault();
  e.stopPropagation();
  stage.classList.remove("drag-over");
  placeFromEvent(e,!!clamp);
}

stage.addEventListener("dragover",onDragOver);
stage.addEventListener("dragenter",function(e){e.preventDefault(); stage.classList.add("drag-over")});
stage.addEventListener("dragleave",onDragLeave);
stage.addEventListener("drop",function(e){onDrop(e,false)});

stageArea.addEventListener("dragover",function(e){e.preventDefault(); try{e.dataTransfer.dropEffect="copy"}catch(err){}});
stageArea.addEventListener("dragenter",function(e){e.preventDefault()});
stageArea.addEventListener("drop",function(e){onDrop(e,true)});

stage.addEventListener("mousedown",function(e){
  if(e.target===stage||e.target.id==="vehicleImg"||e.target.classList.contains("drop-hint")){
    sel=null; renderStage();
  }
});

document.querySelectorAll(".sw").forEach(function(s){
  s.onclick=function(){var on=s.dataset.on==="true"; s.dataset.on=String(!on); s.classList.toggle("on",!on)};
});
document.getElementById("bodyColor").querySelectorAll("button").forEach(function(btn){
  btn.onclick=function(){
    bodyColor=btn.dataset.body;
    document.querySelectorAll("#bodyColor button").forEach(function(b){b.classList.toggle("active",b===btn)});
    renderStage();
  };
});
document.getElementById("colorScheme").querySelectorAll("button").forEach(function(btn){
  btn.onclick=function(){
    scheme=btn.dataset.s;
    document.querySelectorAll("#colorScheme button").forEach(function(b){b.classList.toggle("active",b===btn)});
    renderStage();
  };
});
document.getElementById("clearView").onclick=function(){nodes[view]=[]; sel=null; renderStage(); renderTabs(); renderSum()};
document.getElementById("clearAll").onclick=function(){VIEWS.forEach(function(v){nodes[v.id]=[]}); sel=null; renderStage(); renderTabs(); renderSum()};
document.getElementById("search").oninput=renderParts;
document.getElementById("loadBtn").onclick=function(){
  var q=document.getElementById("quoteInput").value.trim();
  if(!q) return alert("Enter a quote number");
  alert("Quote "+q+" — SKU import when catalog is connected.");
};
document.getElementById("pdfBtn").onclick=function(){window.print()};
renderParts(); renderTabs(); renderStage(); renderSum();
})();
</script>
</body>
</html>
