<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1"/>
<title>Integrity Upfitters - Lighting Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#111113;--surface:#1c1c1f;--s2:#252528;--s3:#2c2c30;--border:#333338;--text:#f4f4f5;--muted:#a1a1aa;--faint:#71717a;--primary:#3b82f6;--pd:rgba(59,130,246,.15)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}
header{height:52px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px}.logo-mark{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg,#3b82f6,#1d4ed8);display:grid;place-items:center}
.logo strong{font-size:13px;display:block}.logo span{font-size:11px;color:var(--muted)}.spacer{flex:1}
select,input[type=text]{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 10px;font-size:13px;font-family:inherit;outline:none}
.btn{background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:7px 12px;font-size:13px;font-family:inherit;cursor:pointer}
.btn:hover{background:var(--s3)}.btn-primary{background:var(--primary);border-color:#2563eb;color:#fff;font-weight:600}
.layout{flex:1;display:grid;grid-template-columns:240px 1fr 220px;min-height:0}
.panel{background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.panel-r{border-right:none;border-left:1px solid var(--border)}
.panel-head{padding:12px 14px 8px;display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--muted);text-transform:uppercase}
.badge{background:var(--s3);color:var(--muted);font-size:11px;padding:2px 7px;border-radius:99px}
.search-wrap{padding:0 12px 10px}.search-wrap input{width:100%}
.parts-list{flex:1;overflow-y:auto;padding:0 8px 16px}
.group-title{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;padding:10px 8px 4px}
.part{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;cursor:grab;user-select:none}
.part:hover{background:var(--s2)}.part:active{cursor:grabbing}
.part.placing{outline:1px solid rgba(59,130,246,.55);background:var(--pd)}
.part-dot{width:8px;height:8px;border-radius:50%;background:linear-gradient(90deg,#ef4444,#3b82f6);flex-shrink:0}
.part-sku{font-size:12px;font-weight:600}.part-name{font-size:11px;color:var(--muted)}
.stage-wrap{display:flex;flex-direction:column;min-height:0;background:#0a0a0c}
.view-tabs{display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--border);overflow-x:auto;flex-shrink:0}
.view-tab{background:transparent;border:1px solid transparent;color:var(--muted);border-radius:6px;padding:6px 12px;font-size:12px;font-family:inherit;cursor:pointer;white-space:nowrap}
.view-tab.active{background:var(--pd);border-color:rgba(59,130,246,.35);color:#93c5fd;font-weight:600}
.stage-area{flex:1;display:flex;align-items:center;justify-content:center;padding:12px;min-height:0}
.stage{position:relative;max-width:100%;max-height:100%;background:radial-gradient(ellipse at center,#1a1a1e,#0a0a0c);border-radius:12px;overflow:hidden;border:1px solid var(--border)}
.stage img.vehicle{display:block;max-width:100%;max-height:calc(100vh - 140px);width:auto;height:auto;user-select:none;pointer-events:none;filter:drop-shadow(0 12px 28px rgba(0,0,0,.45))}
.stage.drag-over{outline:2px dashed var(--primary);outline-offset:-4px}
.drop-hint{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(59,130,246,.08);color:#93c5fd;font-weight:600;font-size:14px;pointer-events:none;z-index:5}
.stage.drag-over .drop-hint{display:flex}
.light{position:absolute;cursor:move;transform-origin:center center;z-index:10;touch-action:none;user-select:none}
.light img{display:block;width:100%;height:auto;pointer-events:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
.light.selected{outline:2px solid var(--primary);outline-offset:3px;border-radius:2px}
.light .tag{position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);background:rgba(0,0,0,.9);color:#fff;font-size:10px;font-weight:600;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none;opacity:0}
.light.selected .tag,.light:hover .tag{opacity:1}
.light .ctrls{position:absolute;top:-32px;left:50%;transform:translateX(-50%);display:none;gap:2px;background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:2px;z-index:20}
.light.selected .ctrls{display:flex}
.light .ctrls button{width:26px;height:26px;border:none;background:transparent;color:var(--text);border-radius:4px;cursor:pointer;font-size:13px}
.light .ctrls button:hover{background:var(--s3)}
.stage-bar{display:flex;justify-content:center;gap:8px;padding:10px;flex-shrink:0}
.hint-bar{font-size:11px;color:var(--faint);padding:0 12px 8px;text-align:center}
.panel-section{padding:12px 14px;border-bottom:1px solid var(--border)}
.sec-title{font-size:10px;font-weight:600;letter-spacing:.05em;color:var(--faint);text-transform:uppercase;margin-bottom:8px}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;font-size:13px}
.toggle-row span{color:var(--muted);font-size:11px;display:block}
.sw{width:40px;height:22px;background:var(--s3);border-radius:99px;position:relative;cursor:pointer;border:1px solid var(--border);flex-shrink:0}
.sw.on{background:var(--primary);border-color:#2563eb}
.sw::after{content:"";position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;top:2px;left:2px;transition:left .15s}
.sw.on::after{left:20px}
.schemes{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.scheme{background:var(--s2);border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px;font-size:12px;font-family:inherit;cursor:pointer}
.scheme.active{border-color:var(--primary);color:#93c5fd;background:var(--pd)}
.summary{font-size:12px;color:var(--muted)}.summary div{display:flex;justify-content:space-between;padding:4px 0}
.summary .total{border-top:1px solid var(--border);margin-top:4px;padding-top:8px;font-weight:600;color:var(--text)}
@media print{
  header,.panel,.view-tabs,.stage-bar,.hint-bar{display:none!important}
  .layout{display:block}
  .stage-wrap,.stage-area,.stage{background:#fff;border:none}
  .stage img.vehicle{max-height:none;width:100%}
}
</style>
</head>
<body>
<!--
  Durango-first lighting visualizer (source of truth: this file, not compiled-app/).
  Local run:
    - Open visualizer/index.html in a browser, OR
    - From repo root: npx --yes serve visualizer
-->
<header>
<div class="logo"><div class="logo-mark">&#9889;</div><div><strong>Lighting Visualizer</strong><span>Integrity Upfitters · Durango</span></div></div>
<select id="vehicleSelect" aria-label="Vehicle"><option>Dodge Durango Pursuit</option></select>
<input type="text" id="quoteInput" placeholder="Quote #" style="width:100px"/>
<button class="btn" id="loadBtn">Load SKUs</button>
<div class="spacer"></div>
<button class="btn btn-primary" id="pdfBtn">PDF Sign-off</button>
</header>
<div class="layout">
<aside class="panel">
<div class="panel-head">Parts <span class="badge" id="skuBadge">0</span></div>
<div class="search-wrap"><input type="text" id="search" placeholder="Search SKU or name..."/></div>
<div class="parts-list" id="partsList"></div>
</aside>
<section class="stage-wrap">
<div class="view-tabs" id="viewTabs"></div>
<div class="hint-bar" id="hintBar">Drag a part onto the vehicle, or click a part to place at its default mount.</div>
<div class="stage-area" id="stageArea">
<div class="stage" id="stage">
<img class="vehicle" id="vehicleImg" src="durango_front.png" alt="Vehicle" draggable="false"/>
<div class="drop-hint">Drop light here</div>
</div>
</div>
<div class="stage-bar">
<button class="btn" id="clearView">Clear View</button>
<button class="btn" id="clearAll">Clear All</button>
</div>
</section>
<aside class="panel panel-r">
<div class="panel-section">
<div class="sec-title">Build Parameters</div>
<div class="toggle-row"><div>Push Bar<span>Front bumper guard</span></div><div class="sw" data-on="false"></div></div>
<div class="toggle-row"><div>Interior Dash<span>Windshield warning</span></div><div class="sw" data-on="false"></div></div>
<div class="toggle-row"><div>Rear Hatch Lights<span>Liftgate glass stick</span></div><div class="sw" data-on="false"></div></div>
</div>
<div class="panel-section">
<div class="sec-title">Body Color</div>
<div class="schemes" id="bodyColor">
<button class="scheme active" data-body="white">White</button>
<button class="scheme" data-body="black">Black</button>
</div>
</div>
<div class="panel-section">
<div class="sec-title">Color Scheme</div>
<div class="schemes" id="colorScheme">
<button class="scheme active" data-s="rb">Red / Blue</button>
<button class="scheme" data-s="bw">Blue / White</button>
<button class="scheme" data-s="rw">Red / White</button>
<button class="scheme" data-s="rbw">R / B / W</button>
</div>
</div>
<div class="panel-section">
<div class="sec-title">Placement</div>
<div class="summary" id="summary"></div>
</div>
</aside>
</div>
<script>
(function(){
/* Durango-only visualizer. w values ≈ % of stage/vehicle width for FedSig sprites.
   ALGT 53" roof bar ≈ 46–52% of roof width; MicroPulse grille ≈ 3.5–5%. */
var VIEWS=[
{id:"front",label:"Front",imgW:"durango_front.png",imgB:"durango_front_black.png"},
{id:"rear",label:"Rear",imgW:"durango_rear.png",imgB:"durango_rear_black.png"},
{id:"rear_open",label:"Hatch Open",imgW:"durango_rear_open.png",imgB:"durango_rear_open_black.png"},
{id:"left",label:"Left",imgW:"durango_left.png",imgB:"durango_left_black.png"},
{id:"right",label:"Right",imgW:"durango_right.png",imgB:"durango_right_black.png"},
{id:"hero",label:"3/4 View",imgW:"durango_hero.png",imgB:"durango_hero_black.png"}
];
var CATALOG=[
{sku:"ALGT",name:"Allegiant Roof Lightbar (53\")",group:"Front / Perimeter",fx:"fx_algt_rb.png",w:48},
{sku:"SIFMJS",name:"SpectraLux ILS Visor (Front)",group:"Front / Perimeter",fx:"fx_ils_rb.png",w:24},
{sku:"DYNA-1",name:"DynaFlare 1 ft",group:"Front / Perimeter",fx:"fx_dyna_1ft_rb.png",w:10},
{sku:"DYNA-2",name:"DynaFlare 2 ft",group:"Front / Perimeter",fx:"fx_dyna_2ft_rb.png",w:18},
{sku:"DYNA-5",name:"DynaFlare 5 ft",group:"Front / Perimeter",fx:"fx_dyna_5ft_rb.png",w:40},
{sku:"DYNA-6",name:"DynaFlare 6 ft",group:"Front / Perimeter",fx:"fx_dyna_6ft_rb.png",w:48},
{sku:"MPS63",name:"MicroPulse 6-3 Grille",group:"Front / Perimeter",fx:"fx_mps63_rb.png",w:4},
{sku:"MPSW9",name:"MicroPulse Wide 9 Mirror",group:"Front / Perimeter",fx:"fx_mps123_rb.png",w:6},
{sku:"MPS123",name:"MicroPulse 12-3",group:"Rear Hatch",fx:"fx_mps123_rb.png",w:7},
{sku:"SIFMJH",name:"SpectraLux ILS (Rear Hatch)",group:"Rear Hatch",fx:"fx_ils_rb.png",w:22},
{sku:"STICK-RB",name:"Warning Stick R/B",group:"Rear Hatch",fx:"fx_stick_rb.png",w:20},
{sku:"XSM2",name:"SpectraLux XSM2 Module",group:"Rear Hatch",fx:"fx_mps_small_rb.png",w:4},
{sku:"416300",name:"Perimeter Lighthead",group:"Rear Hatch",fx:"fx_round_rb.png",w:3},
{sku:"PF200",name:"PathFinder PF200 Siren Amp",group:"Siren / Control",fx:null,w:6},
{sku:"ES100C",name:"ES100C Speaker",group:"Siren / Control",fx:null,w:5},
{sku:"ESBL",name:"ES100 Speaker Bracket",group:"Siren / Control",fx:null,w:5},
{sku:"OBDFORD",name:"OBD Interface (Ford)",group:"Siren / Control",fx:null,w:5},
{sku:"EXPMOD24",name:"Expansion Module 24",group:"Siren / Control",fx:null,w:5}
];
var DEFAULTS={ALGT:[0.5,0.16],SIFMJS:[0.5,0.26],MPS63:[0.38,0.48],MPSW9:[0.18,0.4],"DYNA-1":[0.5,0.72],"DYNA-2":[0.5,0.72],"DYNA-5":[0.5,0.72],"DYNA-6":[0.5,0.72],SIFMJH:[0.5,0.55],"STICK-RB":[0.5,0.58],MPS123:[0.5,0.62],XSM2:[0.55,0.55],"416300":[0.7,0.55]};
var view="front",bodyColor="white",scheme="rb",nodes={},sel=null,nid=1;
var dragSku=null,dragClearTimer=null,emptyDragImg=null;

VIEWS.forEach(function(v){nodes[v.id]=[]});

function getEmptyDragImage(){
  if(emptyDragImg) return emptyDragImg;
  emptyDragImg=document.createElement("canvas");
  emptyDragImg.width=1; emptyDragImg.height=1;
  return emptyDragImg;
}
function setDragSku(sku){
  if(dragClearTimer){clearTimeout(dragClearTimer); dragClearTimer=null}
  dragSku=sku||null;
}
function clearDragSkuSoon(){
  /* Keep SKU through drop: dragend often fires before drop in some browsers. */
  if(dragClearTimer) clearTimeout(dragClearTimer);
  dragClearTimer=setTimeout(function(){dragSku=null; dragClearTimer=null},80);
}
function resolveDragSku(e){
  var fromDt="";
  try{fromDt=e.dataTransfer&&e.dataTransfer.getData("text/plain")||""}catch(err){}
  return fromDt||dragSku||null;
}

function fxFor(part){
  if(!part.fx) return null;
  var f=part.fx;
  if(scheme==="bw") f=f.replace("_rb.","_bw.").replace("_r.","_bw.").replace("_b.","_bw.");
  else if(scheme==="rw") f=f.replace("_rb.","_r.").replace("_bw.","_r.").replace("_b.","_r.");
  return "fx/"+f;
}
function renderParts(){
  var q=(document.getElementById("search").value||"").toLowerCase();
  var groups={},count=0;
  CATALOG.forEach(function(p){
    if(q&&p.sku.toLowerCase().indexOf(q)<0&&p.name.toLowerCase().indexOf(q)<0) return;
    (groups[p.group]=groups[p.group]||[]).push(p);
  });
  var el=document.getElementById("partsList"); el.innerHTML="";
  Object.keys(groups).forEach(function(g){
    var t=document.createElement("div"); t.className="group-title"; t.textContent=g; el.appendChild(t);
    groups[g].forEach(function(p){
      count++;
      var row=document.createElement("div");
      row.className="part"; row.draggable=true; row.dataset.sku=p.sku;
      row.innerHTML='<div class="part-dot"></div><div><div class="part-sku">'+p.sku+'</div><div class="part-name">'+p.name+"</div></div>";
      row.addEventListener("dragstart",function(e){
        setDragSku(p.sku);
        try{
          e.dataTransfer.setData("text/plain",p.sku);
          e.dataTransfer.setData("application/x-iu-sku",p.sku);
          e.dataTransfer.effectAllowed="copy";
          e.dataTransfer.setDragImage(getEmptyDragImage(),0,0);
        }catch(err){}
        row.classList.add("placing");
        document.getElementById("hintBar").textContent="Drop on the vehicle to place "+p.sku+".";
      });
      row.addEventListener("dragend",function(){
        row.classList.remove("placing");
        clearDragSkuSoon();
        document.getElementById("hintBar").textContent="Drag a part onto the vehicle, or click a part to place at its default mount.";
      });
      row.addEventListener("click",function(){
        var d=DEFAULTS[p.sku]||[0.5,0.4];
        addNode(p.sku,d[0],d[1]);
      });
      el.appendChild(row);
    });
  });
  document.getElementById("skuBadge").textContent=String(count);
}
function renderTabs(){
  var el=document.getElementById("viewTabs"); el.innerHTML="";
  VIEWS.forEach(function(v){
    var b=document.createElement("button");
    b.className="view-tab"+(v.id===view?" active":"");
    b.textContent=v.label+" ("+nodes[v.id].length+")";
    b.onclick=function(){view=v.id;sel=null;renderTabs();renderStage();renderSum()};
    el.appendChild(b);
  });
}
function renderStage(){
  var v=VIEWS.find(function(x){return x.id===view});
  document.getElementById("vehicleImg").src=bodyColor==="black"?v.imgB:v.imgW;
  var stage=document.getElementById("stage");
  stage.querySelectorAll(".light").forEach(function(n){n.remove()});
  nodes[view].forEach(function(p){
    var el=document.createElement("div");
    el.className="light"+(p.id===sel?" selected":"");
    el.dataset.id=String(p.id);
    el.style.left=(p.x*100)+"%";
    el.style.top=(p.y*100)+"%";
    el.style.width=(p.w*p.scale)+"%";
    el.style.transform="translate(-50%,-50%) rotate("+p.rot+"deg)";
    var part=CATALOG.find(function(c){return c.sku===p.sku});
    var src=part?fxFor(part):null;
    if(src){
      el.innerHTML='<img src="'+src+'" alt="'+p.sku+'" draggable="false"/><div class="tag">'+p.sku+'</div><div class="ctrls"><button type="button" data-act="rot" title="Rotate">&#8635;</button><button type="button" data-act="in" title="Larger">+</button><button type="button" data-act="out" title="Smaller">&#8722;</button><button type="button" data-act="del" title="Remove">&#215;</button></div>';
    } else {
      el.innerHTML='<div style="background:#333;color:#aaa;font-size:10px;padding:4px 8px;border-radius:4px">'+p.sku+'</div><div class="tag">'+p.sku+'</div><div class="ctrls"><button type="button" data-act="del" title="Remove">&#215;</button></div>';
    }
    el.addEventListener("mousedown",function(e){
      if(e.target.closest(".ctrls")) return;
      e.preventDefault(); e.stopPropagation();
      sel=p.id; renderStage();
      var node=nodes[view].find(function(n){return n.id===p.id});
      if(node) startMove(e,node,false);
    });
    el.addEventListener("touchstart",function(e){
      if(e.target.closest(".ctrls")) return;
      e.stopPropagation();
      sel=p.id; renderStage();
      var node=nodes[view].find(function(n){return n.id===p.id});
      if(node) startMove(e,node,true);
    },{passive:false});
    el.querySelectorAll(".ctrls button").forEach(function(btn){
      btn.onclick=function(e){
        e.stopPropagation();
        var a=btn.dataset.act;
        if(a==="del"){nodes[view]=nodes[view].filter(function(n){return n.id!==p.id}); sel=null}
        else if(a==="rot") p.rot=(p.rot+15)%360;
        else if(a==="in") p.scale=Math.min(2.5,+(p.scale+0.1).toFixed(2));
        else if(a==="out") p.scale=Math.max(0.3,+(p.scale-0.1).toFixed(2));
        renderStage(); renderTabs(); renderSum();
      };
    });
    stage.appendChild(el);
  });
}
function startMove(e,p,isTouch){
  var stage=document.getElementById("stage");
  var rect=stage.getBoundingClientRect();
  function point(ev){
    var t=isTouch?(ev.touches[0]||ev.changedTouches[0]):ev;
    return {x:(t.clientX-rect.left)/rect.width,y:(t.clientY-rect.top)/rect.height};
  }
  function onMove(ev){
    if(isTouch) ev.preventDefault();
    var c=point(ev);
    p.x=Math.max(0.02,Math.min(0.98,c.x));
    p.y=Math.max(0.02,Math.min(0.98,c.y));
    var n=document.querySelector('.light[data-id="'+p.id+'"]');
    if(n){n.style.left=(p.x*100)+"%"; n.style.top=(p.y*100)+"%"}
  }
  function onUp(){
    document.removeEventListener(isTouch?"touchmove":"mousemove",onMove);
    document.removeEventListener(isTouch?"touchend":"mouseup",onUp);
    if(!isTouch) document.removeEventListener("mouseup",onUp);
    renderSum();
  }
  document.addEventListener(isTouch?"touchmove":"mousemove",onMove,{passive:false});
  document.addEventListener(isTouch?"touchend":"mouseup",onUp);
}
function addNode(sku,x,y){
  var part=CATALOG.find(function(p){return p.sku===sku});
  if(!part) return;
  var id=nid++;
  nodes[view].push({id:id,sku:part.sku,name:part.name,w:part.w||10,x:x,y:y,scale:1,rot:0});
  sel=id;
  renderStage(); renderTabs(); renderSum();
}
function placeFromEvent(e,clamp){
  var sku=resolveDragSku(e);
  if(!sku) return false;
  var stage=document.getElementById("stage");
  var r=stage.getBoundingClientRect();
  var x=(e.clientX-r.left)/r.width;
  var y=(e.clientY-r.top)/r.height;
  if(clamp){
    x=Math.max(0.1,Math.min(0.9,x));
    y=Math.max(0.1,Math.min(0.9,y));
  } else {
    x=Math.max(0.02,Math.min(0.98,x));
    y=Math.max(0.02,Math.min(0.98,y));
  }
  addNode(sku,x,y);
  setDragSku(null);
  return true;
}
function renderSum(){
  var total=0,html="";
  VIEWS.forEach(function(v){var n=nodes[v.id].length; total+=n; html+="<div><span>"+v.label+"</span><span>"+n+"</span></div>"});
  html+='<div class="total"><span>Total</span><span>'+total+"</span></div>";
  document.getElementById("summary").innerHTML=html;
}

var stage=document.getElementById("stage");
var stageArea=document.getElementById("stageArea");

function onDragOver(e){
  e.preventDefault();
  try{e.dataTransfer.dropEffect="copy"}catch(err){}
  stage.classList.add("drag-over");
}
function onDragLeave(e){
  if(!stage.contains(e.relatedTarget)&&e.relatedTarget!==stage) stage.classList.remove("drag-over");
}
function onDrop(e,clamp){
  e.preventDefault();
  e.stopPropagation();
  stage.classList.remove("drag-over");
  placeFromEvent(e,!!clamp);
}

stage.addEventListener("dragover",onDragOver);
stage.addEventListener("dragenter",function(e){e.preventDefault(); stage.classList.add("drag-over")});
stage.addEventListener("dragleave",onDragLeave);
stage.addEventListener("drop",function(e){onDrop(e,false)});

stageArea.addEventListener("dragover",function(e){e.preventDefault(); try{e.dataTransfer.dropEffect="copy"}catch(err){}});
stageArea.addEventListener("dragenter",function(e){e.preventDefault()});
stageArea.addEventListener("drop",function(e){onDrop(e,true)});

stage.addEventListener("mousedown",function(e){
  if(e.target===stage||e.target.id==="vehicleImg"||e.target.classList.contains("drop-hint")){
    sel=null; renderStage();
  }
});

document.querySelectorAll(".sw").forEach(function(s){
  s.onclick=function(){var on=s.dataset.on==="true"; s.dataset.on=String(!on); s.classList.toggle("on",!on)};
});
document.getElementById("bodyColor").querySelectorAll("button").forEach(function(btn){
  btn.onclick=function(){bodyColor=btn.dataset.body; document.querySelectorAll("#bodyColor button").forEach(function(b){b.classList.toggle("active",b===btn)}); renderStage()};
});
document.getElementById("colorScheme").querySelectorAll("button").forEach(function(btn){
  btn.onclick=function(){scheme=btn.dataset.s; document.querySelectorAll("#colorScheme button").forEach(function(b){b.classList.toggle("active",b===btn)}); renderStage()};
});
document.getElementById("clearView").onclick=function(){nodes[view]=[]; sel=null; renderStage(); renderTabs(); renderSum()};
document.getElementById("clearAll").onclick=function(){VIEWS.forEach(function(v){nodes[v.id]=[]}); sel=null; renderStage(); renderTabs(); renderSum()};
document.getElementById("search").oninput=renderParts;
document.getElementById("loadBtn").onclick=function(){var q=document.getElementById("quoteInput").value.trim(); if(!q) return alert("Enter a quote number"); alert("Quote "+q+" — SKU import when catalog is connected.")};
document.getElementById("pdfBtn").onclick=function(){window.print()};
renderParts(); renderTabs(); renderStage(); renderSum();
})();
</script>
</body>
</html>
